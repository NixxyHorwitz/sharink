<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="icons/icon32.png" alt="logo" class="logo">
        <span class="brand-title">Sharink</span>
      </div>
      <div class="header-right">
        <span id="connectionBadge" class="badge badge-disconnected">Offline</span>
        <button id="btnOpenOptions" class="btn-icon" title="Pengaturan">⚙️</button>
      </div>
    </header>

    <!-- Current Tab Section -->
    <div class="card current-tab-card">
      <div class="tab-info">
        <div id="currentTabTitle" class="tab-title">Memuat info tab...</div>
        <div id="currentTabUrl" class="tab-url">...</div>
      </div>
      <button id="btnSendCurrentTab" class="btn btn-send">
        🚀 Kirim Tab Ini Sekarang
      </button>
      <div id="sendFeedback" class="feedback-msg"></div>
    </div>

    <!-- Pair Code Section -->
    <div class="card pair-section">
      <div class="section-header">
        <label for="inputPairCode" class="label-title">Pair Code Perangkat</label>
        <button id="btnRandomCode" class="btn-text">🎲 Acak</button>
      </div>
      <div class="pair-input-group">
        <input 
          type="text" 
          id="inputPairCode" 
          placeholder="Misal: WORK-PC" 
          spellcheck="false"
        >
        <button id="btnSavePairCode" class="btn btn-primary">Simpan</button>
      </div>
      <div id="pairStatus" class="subtext">Masukkan kode yang sama di perangkat lain.</div>
    </div>

    <!-- Quick Manual URL Dropdown / Section -->
    <details class="manual-send-section">
      <summary class="summary-btn">Kirim URL Lain / Manual ▾</summary>
      <div class="manual-send-form">
        <input type="url" id="manualUrlInput" placeholder="https://...">
        <button id="btnSendManual" class="btn btn-secondary">Kirim Link</button>
      </div>
    </details>

    <!-- History Tabs -->
    <div class="history-section">
      <div class="history-tabs">
        <button id="tabReceivedBtn" class="history-tab active">📥 Masuk (<span id="receivedCount">0</span>)</button>
        <button id="tabSentBtn" class="history-tab">📤 Terkirim (<span id="sentCount">0</span>)</button>
      </div>
      <div id="historyList" class="history-list">
        <div class="empty-state">Belum ada riwayat link.</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
