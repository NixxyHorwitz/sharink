<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Big Romantic Banner with Couple Photo -->
    <div class="banner-wrapper">
      <div class="romantic-banner">
        <img src="couple.jpg" alt="Fahri & Jihan" id="bannerImg" class="banner-image">
        <div class="banner-overlay"></div>
        
        <!-- Top bar inside banner -->
        <div class="banner-top-bar">
          <div class="banner-badge">
            <span class="status-dot-pulse" id="statusDot"></span>
            <span id="connectionBadge" class="banner-status-text">Online</span>
          </div>
          <button id="btnOpenOptions" class="btn-glass" title="Pengaturan Server">⚙️</button>
        </div>

        <!-- Banner bottom title -->
        <div class="banner-caption">
          <div class="couple-names">Fahri <span class="heart-anim">❤️</span> Jihan</div>
          <div class="couple-sub">Selalu terhubung, di mana pun berada ✨</div>
        </div>
      </div>

      <!-- Overlapping Dual Avatars (Fahri & Jihan) -->
      <div class="avatars-overlap-row">
        <div class="avatar-box">
          <img src="fahri.jpg" alt="Fahri" class="avatar-photo" title="Fahri">
          <span class="avatar-name">Fahri</span>
        </div>
        <div class="avatar-heart-bridge">
          <span class="heart-pulse-icon">💖</span>
        </div>
        <div class="avatar-box">
          <img src="jihan.jpg" alt="Jihan" class="avatar-photo" title="Jihan">
          <span class="avatar-name">Jihan</span>
        </div>
      </div>
    </div>

    <!-- Floating hearts animation canvas -->
    <div id="heartsContainer" class="hearts-container"></div>

    <!-- Active Tab Send Card -->
    <section class="card active-tab-card">
      <div class="tab-preview">
        <div class="tab-icon-wrap">🌐</div>
        <div class="tab-details">
          <div id="currentTabTitle" class="tab-title">Memuat info tab...</div>
          <div id="currentTabUrl" class="tab-url">...</div>
        </div>
      </div>
      <button id="btnSendCurrentTab" class="btn btn-love-gradient">
        <span class="btn-icon-symbol">💌</span>
        <span class="btn-text-content">Kirim Tab ke Pasangan</span>
      </button>
      <div id="sendFeedback" class="feedback-msg"></div>
    </section>

    <!-- Pair Code Bar (Compact Inline) -->
    <section class="card compact-pair-card">
      <div class="pair-row">
        <span class="pair-label">🔑 Pair Code:</span>
        <div class="pair-input-wrap">
          <input 
            type="text" 
            id="inputPairCode" 
            placeholder="FAHRI-JIHAN" 
            spellcheck="false"
            autocomplete="off"
          >
        </div>
        <button id="btnSavePairCode" class="btn-chip" title="Simpan Pair Code">Simpan</button>
        <button id="btnRandomCode" class="btn-chip-ghost" title="Acak Kode">🎲</button>
      </div>
      <div id="pairStatus" class="subtext-pair">Kode harus sama di kedua browser.</div>
    </section>

    <!-- Manual Send (Collapsible Compact) -->
    <details class="manual-dropdown">
      <summary class="dropdown-trigger">
        <span>✍️ Kirim link manual lainnya</span>
        <span class="chevron">▾</span>
      </summary>
      <div class="dropdown-content">
        <input type="url" id="manualUrlInput" placeholder="https://..." class="input-compact">
        <button id="btnSendManual" class="btn btn-secondary-compact">Kirim</button>
      </div>
    </details>

    <!-- History (Compact Switcher) -->
    <section class="card history-card">
      <div class="history-nav">
        <button id="tabReceivedBtn" class="history-nav-btn active">
          📥 Diterima (<span id="receivedCount">0</span>)
        </button>
        <button id="tabSentBtn" class="history-nav-btn">
          📤 Terkirim (<span id="sentCount">0</span>)
        </button>
      </div>
      <div id="historyList" class="history-list">
        <div class="empty-state">Belum ada link yang diterima.</div>
      </div>
    </section>

    <!-- Sweet Micro Footer -->
    <footer class="micro-footer">
      <span>Sharink &bull; Dibuat khusus dengan ❤️ untuk Fahri &amp; Jihan</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
